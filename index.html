<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程与讲师管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>课程与讲师管理系统</h1>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="form-container">
                    <h2>添加课程信息</h2>
                    <form id="course-form">
                        <div class="form-group">
                            <label for="date">日期:</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="course-name">课程名称:</label>
                            <input type="text" id="course-name" required>
                        </div>
                        <div class="form-group">
                            <label for="teacher-name">讲师姓名:</label>
                            <input type="text" id="teacher-name" required>
                        </div>
                        <button type="submit" class="btn">保存</button>
                    </form>
                </div>
                
                <div class="search-container">
                    <h2>查询课程信息</h2>
                    <div class="form-group">
                        <label for="search-type">查询类型:</label>
                        <select id="search-type">
                            <option value="course">按课程名称</option>
                            <option value="teacher">按讲师姓名</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="search-term">查询内容:</label>
                        <input type="text" id="search-term">
                    </div>
                    <button id="search-btn" class="btn">查询</button>
                    <button id="clear-search-btn" class="btn">清除查询</button>
                </div>
                
                <div class="export-container">
                    <h2>数据导出</h2>
                    <div class="form-group">
                        <label for="export-type">导出范围:</label>
                        <select id="export-type">
                            <option value="all">所有课程</option>
                            <option value="current">当前月份课程</option>
                            <option value="filtered">当前筛选结果</option>
                        </select>
                    </div>
                    <button id="export-btn" class="btn">导出为Excel</button>
                </div>
            </div>
            
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prev-month" class="btn">上个月</button>
                    <h2 id="month-year">2023年9月</h2>
                    <button id="next-month" class="btn">下个月</button>
                </div>
                <div class="weekdays">
                    <div>周日</div>
                    <div>周一</div>
                    <div>周二</div>
                    <div>周三</div>
                    <div>周四</div>
                    <div>周五</div>
                    <div>周六</div>
                </div>
                <div id="calendar" class="calendar-grid"></div>
            </div>
        </div>
        
        <div id="course-details" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>当日课程详情</h2>
                <div id="course-list"></div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
